name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Deploys Firestore rules/indexes and the static frontend (Hosting)
      # only - both are free on Firebase's Spark plan. The backend server
      # (server/) deploys separately via Render's own GitHub integration,
      # not through this workflow - see the README.
      #
      # To create the secret this step needs:
      #   1. Firebase console -> Project settings -> Service accounts
      #      -> Generate new private key  (downloads a .json file)
      #   2. GitHub repo -> Settings -> Secrets and variables -> Actions
      #      -> New repository secret
      #      Name:  FIREBASE_SERVICE_ACCOUNT
      #      Value: paste the entire contents of that .json file
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy
        run: npx firebase-tools deploy --only firestore,hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
